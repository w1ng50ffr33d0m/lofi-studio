<div class="studio-container">
  <header class="studio-header">
    <h1>Lofi Studio</h1>
    <p>Find your focus with ambience sounds and Lofi music</p>
  </header>

  <main class="mixer-grid">
    @for (track of tracks(); track track.id) {
      <div class="track-card" [class.active]="track.isPlaying">
        <div class="card-header">
          <h3>{{ track.name }}</h3>
          <button 
            class="play-btn" 
            (click)="onToggleTrack(track)">
            {{ track.isPlaying ? 'Pause' : 'Play' }}
          </button>
        </div>

        <div class="sliders">
          <label>Volume: {{ Math.round(track.volume * 100) }}%</label>
          <input type="range" min="0" max="1" step="0.01" [value]="track.volume" (input)="onVolumeChange(track, $event)" />
        </div>

        <div class="sliders">
          <label>Pan: {{ track.pan === 0 ? 'Center' : (track.pan < 0 ? 'Left' : 'Right') }}</label>
          <input type="range" min="-1" max="1" step="0.1" [value]="track.pan" (input)="onPanChange(track, $event)" />
        </div>
      </div>
    }
  </main>
</div>
